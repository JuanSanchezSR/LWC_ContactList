<template>
    <lightning-card title="Lista de Contactos" icon-name="standard:contact">
        <template if:true={contacts}>
            <lightning-datatable
                key-field="Id"
                data={contacts}
                columns={columns}
                hide-checkbox-column="true">
            </lightning-datatable>
        </template>

        <template if:true={error}>
            <c-error-panel errors={error}></c-error-panel>
        </template>

        <div class="slds-m-top_medium slds-text-align_center">
            <lightning-button 
                label="Nuevo Contacto" 
                variant="brand" 
                onclick={handleNewContact}>
            </lightning-button>
        </div>
    </lightning-card>

    <template if:true={showForm}>
        <c-contact-form oncontactsaved={handleContactSaved} oncancel={handleCancel}></c-contact-form>
    </template>
</template>
